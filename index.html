<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 회사 포털</title>
<style>
  :root {
    --bg: #ffffff; --soft: #f5f5f7; --ink: #1d1d1f; --mute: #6e6e73; --faint: #c7c7cc;
    --line: #d2d2d7; --accent: #0071e3; --on: #1d1d1f; --on-ink: #f5f5f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }
  main { max-width: 980px; margin: 0 auto; padding: 72px 16px 120px; }
  header { text-align: center; margin-bottom: 64px; }
  header .eyebrow { font-size: 15px; color: var(--mute); font-weight: 500; margin: 0 0 8px; }
  header h1 { font-size: clamp(40px, 7vw, 64px); font-weight: 700; letter-spacing: -0.03em; margin: 0; line-height: 1.05; }
  header p { font-size: clamp(17px, 2.4vw, 21px); color: var(--mute); margin: 16px 0 0; }

  .tree { display: flex; flex-direction: column; align-items: center; }
  .slot { width: 100%; display: flex; justify-content: center; }
  .stem { width: 1px; height: 36px; background: var(--line); }

  .me {
    padding: 14px 32px; border-radius: 980px; border: 1px solid var(--ink);
    font-size: 17px; font-weight: 600;
  }

  .card {
    width: 100%; max-width: 420px; text-align: center; cursor: pointer;
    background: var(--soft); border-radius: 24px; padding: 32px 24px;
    border: 0; font: inherit; color: inherit;
    display: flex; flex-direction: column; align-items: center;
    transition: transform .25s ease, opacity .4s ease, background .4s ease, color .4s ease;
  }
  .card:hover { transform: scale(1.015); }
  .card .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 980px; margin-bottom: 14px; }
  .card h2 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .card h3 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .card .sub { font-size: 17px; margin-top: 4px; }
  .card .role { font-size: 14px; margin-top: 12px; line-height: 1.5; }

  .card.active { background: var(--on); color: var(--on-ink); }
  .card.active .tag { background: #30d158; color: #003a12; }
  .card.active .sub, .card.active .role { color: #a1a1a6; }

  .card.vacant { opacity: .42; }
  .card.vacant .tag { background: #e8e8ed; color: var(--mute); }
  .card.vacant .sub, .card.vacant .role { color: var(--mute); }
  .card.vacant h2, .card.vacant h3 { color: var(--mute); }

  .depts { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; position: relative; padding-top: 36px; }
  .depts::before { content: ""; position: absolute; top: 0; left: 12.5%; right: 12.5%; height: 1px; background: var(--line); }
  .depts .card { max-width: none; padding: 28px 16px; position: relative; }
  .depts .card::before { content: ""; position: absolute; top: -36px; left: 50%; width: 1px; height: 36px; background: var(--line); }
  @media (max-width: 720px) {
    .depts { grid-template-columns: repeat(2, 1fr); }
    .depts::before, .depts .card::before { display: none; }
  }

  .talk { margin-top: 96px; }
  .talk-head { text-align: center; margin-bottom: 28px; }
  .talk-head h2 { font-size: clamp(28px, 4.5vw, 40px); font-weight: 700; letter-spacing: -0.025em; margin: 0; }
  .talk-head p { color: var(--mute); font-size: 17px; margin: 10px 0 0; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); margin-top: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .live.on .dot { background: #30d158; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .feed {
    max-width: 680px; margin: 0 auto; min-height: 220px; max-height: 520px; overflow-y: auto;
    background: var(--soft); border-radius: 24px; padding: 24px;
  }
  .msg { display: flex; flex-direction: column; gap: 4px; padding: 14px 4px; border-bottom: 1px solid #e8e8ed; animation: rise .5s ease; }
  .msg:last-child { border-bottom: 0; }
  .msg .who { font-size: 13px; font-weight: 600; color: var(--mute); }
  .msg .who b { color: var(--ink); }
  .msg .text { font-size: 17px; line-height: 1.5; }
  .empty { color: var(--mute); text-align: center; padding: 64px 0; font-size: 17px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.32); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .sheet.open { display: flex; }
  .panel { background: #fff; border-radius: 24px; width: 100%; max-width: 720px; max-height: 86vh; display: flex; flex-direction: column; overflow: hidden; }
  .panel-head { padding: 24px 28px 16px; display: flex; justify-content: space-between; align-items: start; gap: 16px; }
  .panel-head h2 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  .panel-head p { margin: 4px 0 0; color: var(--mute); font-size: 15px; }
  .close { border: 0; background: var(--soft); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--mute); flex: none; }
  .outs { padding: 0 28px; display: flex; gap: 8px; flex-wrap: wrap; }
  .outs button { border: 1px solid var(--line); background: #fff; border-radius: 980px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .outs button.sel { background: var(--ink); color: #fff; border-color: var(--ink); }
  .doc { margin: 16px 28px 28px; padding: 20px; background: var(--soft); border-radius: 16px; overflow: auto; white-space: pre-wrap; font-size: 15px; line-height: 1.65; }

  .doc.frame { padding: 0; background: #fff; border: 1px solid #e8e8ed; overflow: hidden; height: 70vh; }
  .doc.frame iframe { border: 0; width: 100%; height: 100%; display: block; }

  footer { text-align: center; color: var(--faint); font-size: 12px; margin-top: 64px; }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow" id="company">SK실트론</p>
    <h1>우리 AI 회사</h1>
    <p>한 명씩 채용하며, 눈으로 보면서 키워갑니다.</p>
  </header>

  <section class="tree" aria-label="조직도">
    <div class="me">나 · 대표</div>
    <div class="stem"></div>
    <div class="slot" id="slot-ceo"></div>
    <div class="stem"></div>
    <div class="slot" id="slot-arumi"></div>
    <div class="stem"></div>
    <div class="depts" id="depts"></div>
  </section>

  <section class="talk">
    <div class="talk-head">
      <h2>지금 오가는 이야기</h2>
      <p>직원들이 일하며 나누는 말이 여기에 한 줄씩 나타납니다.</p>
      <div class="live" id="live"><span class="dot"></span><span id="liveText">연결 대기 중</span></div>
    </div>
    <div class="feed" id="feed"></div>
  </section>

  <footer>live.json을 1초마다 읽어 화면을 새로 그립니다.</footer>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="panel">
    <div class="panel-head">
      <div><h2 id="pTitle"></h2><p id="pRole"></p></div>
      <button class="close" id="pClose" aria-label="닫기">×</button>
    </div>
    <div class="outs" id="pOuts"></div>
    <div class="doc" id="pDoc"></div>
  </div>
</div>

<script>
// 서버 없이 열었을 때 보여줄 기본 상태 (live.json과 같은 모양)
const FALLBACK = {
  company: "SK실트론",
  agents: {
    ceo:      { name: "AI CEO",    sub: "CLAUDE.md", role: "우리 회사의 경영 원칙", status: "active", outputs: [{ title: "경영 원칙 (CLAUDE.md)", path: "CLAUDE.md" }] },
    arumi:    { name: "CEO Agent", sub: "아르미", role: "원칙대로 업무를 나누고 조율하는 실행 담당", status: "vacant", outputs: [] },
    research: { name: "Research",  sub: "알렌", role: "시장 동향과 경쟁사 현황을 조사합니다", status: "active", outputs: [{ title: "최신 조사 보고서", latest: "research" }] },
    strategy: { name: "Strategy",  sub: "전략팀", role: "모은 사실로 방향을 제안합니다", status: "vacant", outputs: [] },
    critic:   { name: "Critic",    sub: "검토팀", role: "빈틈과 위험을 짚어냅니다", status: "vacant", outputs: [] },
    report:   { name: "Report",    sub: "보고팀", role: "대표가 읽을 보고서로 정리합니다", status: "vacant", outputs: [] }
  },
  log: [
    { time: "2026-10-21 15:19", from: "AI CEO", to: "대표", text: "경영 원칙을 세우고 자리에 앉았습니다. 첫 직원 채용을 기다리고 있어요." },
    { time: "2026-10-21 15:43", from: "알렌", to: "대표", text: "Research 부서에 들어왔습니다. 조사를 시작하면 무엇을 하고 있는지 여기에 한 줄씩 적을게요." }
  ]
};
const DEPTS = ["research", "strategy", "critic", "report"];
let state = FALLBACK, lastSig = "", shownLog = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function card(id, a, big) {
  const on = a.status === "active";
  const H = big ? "h2" : "h3";
  return `<button class="card ${on ? "active" : "vacant"}" data-id="${id}">
    <span class="tag">${on ? "착임 완료" : "채용 전"}</span>
    <${H}>${esc(a.name)}</${H}>
    <div class="sub">${esc(a.sub)}</div>
    <div class="role">${esc(a.role)}</div>
  </button>`;
}

function render() {
  const ag = state.agents || {};
  $("company").textContent = state.company || "";
  $("slot-ceo").innerHTML = ag.ceo ? card("ceo", ag.ceo, true) : "";
  $("slot-arumi").innerHTML = ag.arumi ? card("arumi", ag.arumi, true) : "";
  $("depts").innerHTML = DEPTS.filter(d => ag[d]).map(d => card(d, ag[d], false)).join("");

  const log = state.log || [];
  const feed = $("feed");
  if (!log.length) { feed.innerHTML = `<div class="empty">아직 오간 이야기가 없습니다.</div>`; shownLog = 0; return; }
  if (log.length < shownLog || !feed.querySelector(".msg")) { feed.innerHTML = ""; shownLog = 0; }
  const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  for (const m of log.slice(shownLog)) {
    const el = document.createElement("div");
    el.className = "msg";
    el.innerHTML = `<div class="who"><b>${esc(m.from)}</b>${m.to ? " → " + esc(m.to) : ""} · ${esc(m.time)}</div><div class="text">${esc(m.text)}</div>`;
    feed.appendChild(el);
  }
  shownLog = log.length;
  if (nearBottom) feed.scrollTop = feed.scrollHeight;
}

async function poll() {
  try {
    const r = await fetch("live.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw 0;
    const txt = await r.text();
    $("live").classList.add("on"); $("liveText").textContent = "실시간 연결됨";
    if (txt !== lastSig) { lastSig = txt; state = JSON.parse(txt); render(); }
  } catch (e) {
    $("live").classList.remove("on"); $("liveText").textContent = "미리보기 화면 (서버를 켜면 실시간으로 바뀝니다)";
  }
}

// 카드를 누르면 그 직원의 결과물을 엽니다
async function openCard(id) {
  const a = (state.agents || {})[id]; if (!a) return;
  $("pTitle").textContent = `${a.name} · ${a.sub}`;
  $("pRole").textContent = a.status === "active" ? a.role : "아직 채용 전입니다. 채용되면 이곳에 결과물이 쌓입니다.";
  const outs = a.outputs || [];
  $("pOuts").innerHTML = outs.map((o, i) => `<button data-i="${i}">${esc(o.title)}</button>`).join("");
  $("pOuts").onclick = e => { const b = e.target.closest("button"); if (b) showOut(outs, +b.dataset.i); };
  if (outs.length) showOut(outs, 0); else $("pDoc").textContent = "아직 결과물이 없습니다.";
  $("sheet").classList.add("open");
}
// 결과물: { path: "파일" } 또는 { latest: "폴더" } (그 폴더의 가장 최근 파일)
async function showOut(outs, i) {
  [...$("pOuts").children].forEach((b, j) => b.classList.toggle("sel", j === i));
  const o = outs[i], doc = $("pDoc");
  const url = o.latest ? "__latest/" + o.latest : o.path;
  doc.classList.remove("frame"); doc.textContent = "불러오는 중…";
  try {
    const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
    if (r.status === 404 && o.latest) { doc.textContent = `${o.latest} 폴더에 아직 결과물이 없습니다.`; return; }
    if (!r.ok) throw 0;
    if ((r.headers.get("content-type") || "").includes("text/html")) {
      doc.classList.add("frame");
      doc.innerHTML = `<iframe title="${esc(o.title)}" src="${esc(r.url)}"></iframe>`;
    } else {
      doc.textContent = await r.text();
    }
  } catch (e) {
    doc.textContent = `${o.latest ? o.latest + " 폴더의 최신 결과물" : o.path + " 파일"}은 PC에서 서버를 켜면 이 자리에 열립니다.`;
  }
}
document.addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openCard(c.dataset.id); });
$("pClose").onclick = () => $("sheet").classList.remove("open");
$("sheet").onclick = e => { if (e.target.id === "sheet") $("sheet").classList.remove("open"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("sheet").classList.remove("open"); });

render();
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
